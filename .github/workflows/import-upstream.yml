name: Import upstream dbskill

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-upstream.yml'

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror dontbesilent2025/dbskill into this repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/dontbesilent2025/dbskill.git /tmp/dbskill-upstream
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows' \
            /tmp/dbskill-upstream/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Mirror dontbesilent2025/dbskill"
          git push origin HEAD:main
